[project]
name = "my-billing-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rajkumar-Ai-Engineer", email = "178595241+Rajkumar-Ai-Engineer@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "qrcode[pil]>=7.4.2",
    "python-barcode[images]>=0.15.1",
    "Pillow>=10.2.0",
    "pydantic>=2.6.0",
    "httpx>=0.28.1",
    "pywin32>=306; sys_platform == 'win32'",
    "pytest>=8.0.0",
    "supabase>=2.30.0",
    "psycopg2-binary>=2.9.9",
    "psycopg[binary]>=3.1.18",
    "python-dotenv>=1.0.1",
]

[project.scripts]
my-billing-app = "my_billing_app:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
