authors = [
    { name = "Rajkumar-Ai-Engineer", email = "178595241+Rajkumar-Ai-Engineer@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pytest>=9.1.1",
